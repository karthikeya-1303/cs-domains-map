<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The IT Industry — An Interactive Mind Map</title>
<style>
  :root {
    --bg: #0d0f14;
    --bg2: #11141b;
    --panel: #161a23;
    --panel-2: #1c2130;
    --line: #2a303c;
    --text: #e8ebf1;
    --muted: #8b93a3;
    --accent: #6ea8fe;
    --hit: #ffd479;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(1200px 800px at 50% 40%, var(--bg2), var(--bg));
    color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- top bar ---------- */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; align-items: center; gap: 14px;
    padding: 12px 18px;
    background: color-mix(in srgb, var(--bg) 70%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 15px; font-weight: 650; margin: 0; letter-spacing: -0.01em; white-space: nowrap; }
  header .tag { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .spacer { flex: 1; }
  .search { position: relative; width: 240px; }
  .search input {
    width: 100%; background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 9px; padding: 8px 30px 8px 30px; font-size: 13px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(110,168,254,.15); }
  .search .ic { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; }
  .search .cl { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--muted); cursor: pointer; font-size: 15px; display: none; }
  button.btn {
    background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 9px; padding: 8px 11px; font-size: 12.5px; cursor: pointer; white-space: nowrap;
    transition: background .15s, border-color .15s;
  }
  button.btn:hover { background: var(--panel-2); border-color: var(--accent); }

  /* ---------- canvas ---------- */
  #stage { position: fixed; inset: 0; cursor: grab; }
  #stage.grabbing { cursor: grabbing; }
  svg { width: 100%; height: 100%; display: block; }

  .edge { fill: none; stroke-width: 1.6px; opacity: .5; transition: opacity .2s, stroke-width .2s; }

  .node { cursor: pointer; }
  .node .bg {
    rx: 13; ry: 13;
    stroke-width: 1.4px;
    transition: filter .18s, transform .18s;
  }
  .node text {
    fill: var(--text); font-family: var(--font); dominant-baseline: middle;
    pointer-events: none; user-select: none;
  }
  .node .sub { fill: var(--muted); }
  .node:hover .bg { filter: brightness(1.18); }
  .node.has-children .expander { font-weight: 700; }
  .node .expander { fill: #fff; opacity: .85; font-size: 13px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }

  .node.dim { opacity: .16; }
  .edge.dim { opacity: .07; }
  .node.match .bg { stroke: var(--hit) !important; stroke-width: 2.4px; }

  /* ---------- controls bottom-right ---------- */
  .zoomctl {
    position: fixed; right: 16px; bottom: 16px; z-index: 20;
    display: flex; flex-direction: column; gap: 6px;
  }
  .zoomctl button {
    width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); font-size: 17px; cursor: pointer;
  }
  .zoomctl button:hover { background: var(--panel-2); border-color: var(--accent); }

  /* ---------- detail panel ---------- */
  #detail {
    position: fixed; left: 16px; bottom: 16px; z-index: 20;
    width: 320px; max-width: calc(100vw - 32px);
    background: color-mix(in srgb, var(--panel) 94%, transparent);
    backdrop-filter: blur(12px);
    border: 1px solid var(--line); border-radius: 14px; padding: 15px 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,.4);
    transform: translateY(140%); transition: transform .25s cubic-bezier(.2,.8,.2,1);
  }
  #detail.show { transform: translateY(0); }
  #detail .d-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; vertical-align: middle; }
  #detail h3 { margin: 0 0 2px; font-size: 15px; font-weight: 650; display: flex; align-items: center; }
  #detail .path { color: var(--muted); font-size: 11px; margin: 0 0 8px; }
  #detail p.desc { color: var(--text); font-size: 13px; margin: 0 0 12px; line-height: 1.5; }
  #detail a.open {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--accent); color: #0a0d14; font-weight: 600; font-size: 12.5px;
    text-decoration: none; padding: 7px 12px; border-radius: 9px;
  }
  #detail a.open:hover { filter: brightness(1.08); }
  #detail .dclose { position: absolute; top: 10px; right: 12px; background: none; border: none; color: var(--muted); font-size: 17px; cursor: pointer; }

  /* ---------- hint + legend ---------- */
  .hint {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 15;
    color: var(--muted); font-size: 12px; background: color-mix(in srgb, var(--panel) 80%, transparent);
    border: 1px solid var(--line); padding: 7px 14px; border-radius: 20px; pointer-events: none;
    transition: opacity .4s;
  }
  @media (max-width: 760px) {
    header h1 { font-size: 13px; } header .tag { display: none; }
    .search { width: 150px; } #btnLens { display: none; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>The IT Industry</h1>
  <span class="tag">a mind map of what each domain actually solves</span>
  <div class="spacer"></div>
  <div class="search">
    <span class="ic">⌕</span>
    <input id="search" type="text" placeholder="Search a field…" autocomplete="off" spellcheck="false" />
    <button class="cl" id="clearBtn">×</button>
  </div>
  <button class="btn" id="btnLens">Work lens</button>
  <button class="btn" id="btnReset">Reset view</button>
</header>

<div id="stage">
  <svg id="svg" xmlns="http://www.w3.org/2000/svg">
    <g id="viewport">
      <g id="edges"></g>
      <g id="nodes"></g>
    </g>
  </svg>
</div>

<div class="zoomctl">
  <button id="zin" title="Zoom in">+</button>
  <button id="zout" title="Zoom out">−</button>
  <button id="zfit" title="Fit to screen">⤢</button>
</div>

<div id="detail">
  <button class="dclose" id="dclose">×</button>
  <h3><span class="d-dot" id="dDot"></span><span id="dTitle"></span></h3>
  <p class="path" id="dPath"></p>
  <p class="desc" id="dDesc"></p>
  <a class="open" id="dLink" href="#" target="_blank" rel="noopener noreferrer">Open overview ↗</a>
</div>

<div class="hint" id="hint">Click a node to expand · drag to pan · scroll to zoom</div>

/* ============================================================================
   MIND MAP ENGINE — horizontal tidy-tree (L→R), pan/zoom, click-to-expand. No libraries.
   ============================================================================ */
const PALETTE = ["#6ea8fe","#7ee3c9","#c7a0ff","#ffb28a","#ff8fab","#8fd3ff","#ffd479","#9af0b0","#d6a4ff","#8aa0ff","#ffc6e0"];
const svg = document.getElementById("svg");
const gViewport = document.getElementById("viewport");
const gEdges = document.getElementById("edges");
const gNodes = document.getElementById("nodes");
const SVGNS = "http://www.w3.org/2000/svg";

let ROOT = null;           // working tree root (DATA or LENS)
let view = { x: 0, y: 0, k: 1 };  // pan x/y and zoom k

/* --- build an internal tree with layout state --- */
let uid = 0;
function makeTree(src, depth, colorIdx) {
  const n = {
    id: uid++, name: src.name, sub: src.sub || "", link: src.link, desc: src.desc || "",
    depth, colorIdx,
    expanded: depth === 0,           // root starts expanded; domains collapsed
    children: [],
    x: 0, y: 0,
    _raw: src
  };
  if (src.children) {
    src.children.forEach((c, i) => {
      const ci = depth === 0 ? i : colorIdx;   // domains each get their own palette colour
      n.children.push(makeTree(c, depth + 1, ci));
    });
  }
  return n;
}

/* --- horizontal tidy-tree layout (root on the left, children to the right) ---
   x is fixed per depth (columns). y is packed by leaf count so sibling
   subtrees never overlap: each visible leaf consumes ROW_STEP vertically and
   every parent is centred on the vertical span of its visible children.
   This is overlap-free by construction at any depth. */
const COL_STEP = 300;   // horizontal distance between levels
const ROW_STEP = 46;    // vertical distance between adjacent leaves
let _cursorY = 0;

function layout(root) {
  _cursorY = 0;
  assignY(root, 0);
}
/* returns the y assigned to `node` */
function assignY(node, depth) {
  node.x = depth * COL_STEP;
  const kids = node.children;
  if (node.expanded && kids.length) {
    const ys = kids.map(c => assignY(c, depth + 1));
    // centre parent on the midpoint of first and last child
    node.y = (ys[0] + ys[ys.length - 1]) / 2;
  } else {
    // a visible leaf (collapsed or truly childless): take the next row
    node.y = _cursorY;
    _cursorY += ROW_STEP;
  }
  return node.y;
}

/* --- node pill sizing (left-anchored) --- */
function pillWidth(text, fs) { return Math.max(60, text.length * fs * 0.62 + 34); }

/* --- render everything --- */
// horizontal S-curve from a parent's right edge to a child's left edge
function curve(x1,y1,x2,y2) {
  const mx = (x1 + x2) / 2;
  return `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`;
}
function visibleNodes(root) {
  const out = [];
  function rec(n, parent) {
    out.push({ n, parent });
    if (n.expanded) n.children.forEach(c => rec(c, n));
  }
  rec(root, null);
  return out;
}

// node geometry (left-anchored pills)
function nodeDims(n) {
  const isRoot = n.depth === 0;
  const fs = isRoot ? 15 : n.depth === 1 ? 13.5 : 12;
  const h = isRoot ? 44 : n.depth === 1 ? 36 : 30;
  const w = pillWidth(n.name, fs);
  return { isRoot, fs, h, w };
}

function render() {
  layout(ROOT);
  gEdges.innerHTML = ""; gNodes.innerHTML = "";
  const vis = visibleNodes(ROOT);

  // edges — from right edge of parent pill to left edge of child pill
  vis.forEach(({ n, parent }) => {
    if (!parent) return;
    const pd = nodeDims(parent), cd = nodeDims(n);
    const x1 = parent.x + pd.w, y1 = parent.y;   // parent right edge
    const x2 = n.x, y2 = n.y;                     // child left edge
    const path = document.createElementNS(SVGNS, "path");
    path.setAttribute("class", "edge");
    path.setAttribute("d", curve(x1, y1, x2, y2));
    path.setAttribute("stroke", PALETTE[n.colorIdx % PALETTE.length]);
    path.dataset.id = n.id;
    gEdges.appendChild(path);
  });

  // nodes — pill anchored at (n.x, n.y) as its LEFT-middle point
  vis.forEach(({ n }) => {
    const { isRoot, fs, h, w } = nodeDims(n);
    const color = PALETTE[n.colorIdx % PALETTE.length];

    const g = document.createElementNS(SVGNS, "g");
    g.setAttribute("class", "node" + (n.children.length ? " has-children" : ""));
    g.setAttribute("transform", `translate(${n.x},${n.y})`);
    g.dataset.id = n.id;

    const rect = document.createElementNS(SVGNS, "rect");
    rect.setAttribute("class", "bg");
    rect.setAttribute("x", 0); rect.setAttribute("y", -h/2);
    rect.setAttribute("width", w); rect.setAttribute("height", h);
    rect.setAttribute("rx", 11); rect.setAttribute("ry", 11);
    rect.setAttribute("fill", isRoot ? "#1b2030" : hexA(color, 0.14));
    rect.setAttribute("stroke", color);
    g.appendChild(rect);

    const label = document.createElementNS(SVGNS, "text");
    label.setAttribute("x", 14);
    label.setAttribute("y", 0);
    label.setAttribute("text-anchor", "start");
    label.setAttribute("font-size", fs);
    label.setAttribute("font-weight", isRoot ? 700 : n.depth === 1 ? 600 : 500);
    label.textContent = n.name;
    g.appendChild(label);

    // expander badge on the RIGHT edge if it has children
    if (n.children.length) {
      const badge = document.createElementNS(SVGNS, "circle");
      badge.setAttribute("cx", w); badge.setAttribute("cy", 0);
      badge.setAttribute("r", 10);
      badge.setAttribute("fill", color);
      g.appendChild(badge);
      const sign = document.createElementNS(SVGNS, "text");
      sign.setAttribute("class", "expander");
      sign.setAttribute("x", w); sign.setAttribute("y", 0.5);
      sign.setAttribute("fill", "#0a0d14");
      sign.textContent = n.expanded ? "–" : "+";
      g.appendChild(sign);
    }

    g.addEventListener("click", (e) => { e.stopPropagation(); onNodeClick(n); });
    gNodes.appendChild(g);
  });
}

function hexA(hex, a) {
  const h = hex.replace("#","");
  const r = parseInt(h.substring(0,2),16), gg = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${gg},${b},${a})`;
}

/* --- interactions --- */
function findNode(id, node=ROOT) {
  if (node.id === id) return node;
  for (const c of node.children) { const r = findNode(id, c); if (r) return r; }
  return null;
}
function onNodeClick(n) {
  if (n.children.length) {
    // remember the clicked node's on-screen position so it stays put
    const beforeX = n.x, beforeY = n.y;
    n.expanded = !n.expanded;
    layout(ROOT);
    // compensate pan so this node doesn't jump as siblings re-pack
    view.x += (beforeX - n.x) * view.k;
    view.y += (beforeY - n.y) * view.k;
    applyView();
    render();
  }
  showDetail(n);
}

/* --- detail panel --- */
const detail = document.getElementById("detail");
function pathTo(target, node=ROOT, acc=[]) {
  const here = [...acc, node.name];
  if (node.id === target.id) return here;
  for (const c of node.children) { const r = pathTo(target, c, here); if (r) return r; }
  return null;
}
function showDetail(n) {
  const color = PALETTE[n.colorIdx % PALETTE.length];
  document.getElementById("dDot").style.background = n.depth === 0 ? "#fff" : color;
  document.getElementById("dTitle").textContent = n.name;
  const p = pathTo(n) || [n.name];
  document.getElementById("dPath").textContent = p.length > 1 ? p.slice(0, -1).join("  ›  ") : (n.sub || "");
  document.getElementById("dDesc").textContent = n.desc || "";
  const link = document.getElementById("dLink");
  link.href = n.link; 
  detail.classList.add("show");
}
document.getElementById("dclose").addEventListener("click", () => detail.classList.remove("show"));

/* ============================================================================
   PAN / ZOOM
   ============================================================================ */
function applyView() {
  gViewport.setAttribute("transform", `translate(${view.x},${view.y}) scale(${view.k})`);
}
const stage = document.getElementById("stage");
let pointerDown = false, panning = false, last = null, moved = 0, activePointer = null;
const DRAG_THRESHOLD = 5; // px of movement before we treat it as a pan (not a click)

stage.addEventListener("pointerdown", (e) => {
  pointerDown = true; panning = false; moved = 0;
  last = { x: e.clientX, y: e.clientY };
  activePointer = e.pointerId;
  // NOTE: do NOT capture the pointer here — capturing retargets all events
  // to the stage and prevents node <g> elements from ever receiving clicks.
});
stage.addEventListener("pointermove", (e) => {
  if (!pointerDown) return;
  const dx = e.clientX - last.x, dy = e.clientY - last.y;
  moved += Math.abs(dx) + Math.abs(dy);
  // only start panning once movement crosses the threshold
  if (!panning && moved > DRAG_THRESHOLD) {
    panning = true;
    stage.classList.add("grabbing");
    try { stage.setPointerCapture(activePointer); } catch (_) {}
  }
  if (panning) {
    view.x += dx; view.y += dy;
    last = { x: e.clientX, y: e.clientY };
    applyView();
  }
});
function endPointer(e) {
  if (!pointerDown) return;
  pointerDown = false;
  stage.classList.remove("grabbing");
  try { stage.releasePointerCapture(activePointer); } catch (_) {}
  activePointer = null;
  // keep `panning` true until the trailing click fires, so we can suppress it
  if (panning) setTimeout(() => { panning = false; }, 0);
}
stage.addEventListener("pointerup", endPointer);
stage.addEventListener("pointercancel", endPointer);

// A click that followed a real drag should be ignored (capture phase).
stage.addEventListener("click", (e) => {
  if (panning) { e.stopPropagation(); return; }
  // click on empty canvas closes the detail panel
  if (e.target.id === "svg" || e.target.id === "stage") detail.classList.remove("show");
}, true);

stage.addEventListener("wheel", (e) => {
  e.preventDefault();
  const rect = svg.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const factor = e.deltaY < 0 ? 1.12 : 1/1.12;
  zoomAt(mx, my, factor);
}, { passive: false });

function zoomAt(cx, cy, factor) {
  const k2 = Math.min(2.6, Math.max(0.25, view.k * factor));
  const r = k2 / view.k;
  view.x = cx - (cx - view.x) * r;
  view.y = cy - (cy - view.y) * r;
  view.k = k2;
  applyView();
}
document.getElementById("zin").addEventListener("click", () => zoomAt(innerWidth/2, innerHeight/2, 1.2));
document.getElementById("zout").addEventListener("click", () => zoomAt(innerWidth/2, innerHeight/2, 1/1.2));
document.getElementById("zfit").addEventListener("click", fitView);

function fitView() {
  // fit the currently-visible nodes into the viewport (accounting for pill width)
  const vis = visibleNodes(ROOT);
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  vis.forEach(({n}) => {
    const { w, h } = nodeDims(n);
    minX=Math.min(minX,n.x); maxX=Math.max(maxX,n.x + w);
    minY=Math.min(minY,n.y - h/2); maxY=Math.max(maxY,n.y + h/2);
  });
  const padX = 80, padY = 70;
  const w = (maxX - minX) + padX*2, h = (maxY - minY) + padY*2;
  const k = Math.min(1.4, Math.max(0.2, Math.min(innerWidth / w, innerHeight / h)));
  view.k = k;
  // left-anchor horizontally (tree grows rightward from the left margin),
  // centre vertically on the visible content
  view.x = padX * k - minX * k + 10;
  const cy = (minY + maxY) / 2;
  view.y = innerHeight/2 - cy * k;
  applyView();
}

/* ============================================================================
   SEARCH — expands ancestors of matches, highlights, dims the rest.
   ============================================================================ */
const searchInput = document.getElementById("search");
const clearBtn = document.getElementById("clearBtn");

function expandAncestorsOf(pred) {
  // expand any node that has a matching descendant
  function rec(node) {
    let hasMatch = pred(node);
    for (const c of node.children) { if (rec(c)) { node.expanded = true; hasMatch = true; } }
    return hasMatch;
  }
  rec(ROOT);
}
function clearMatches() {
  document.querySelectorAll(".node").forEach(el => el.classList.remove("match","dim"));
  document.querySelectorAll(".edge").forEach(el => el.classList.remove("dim"));
}
function doSearch(term) {
  term = term.trim().toLowerCase();
  clearBtn.style.display = term ? "block" : "none";
  if (!term) { clearMatches(); return; }
  const pred = (n) => n.name.toLowerCase().includes(term) || (n.desc && n.desc.toLowerCase().includes(term));
  // collapse all first (keep root), then expand paths to matches
  ROOT.children.forEach(d => collapseAll(d));
  expandAncestorsOf(pred);
  render();
  // mark matches / dim others
  const matchIds = new Set();
  (function rec(n){ if (pred(n)) matchIds.add(n.id); n.children.forEach(rec); })(ROOT);
  document.querySelectorAll(".node").forEach(el => {
    const id = Number(el.dataset.id);
    if (matchIds.has(id)) el.classList.add("match"); else el.classList.add("dim");
  });
  document.querySelectorAll(".edge").forEach(el => el.classList.add("dim"));
  fitView();
}
function collapseAll(node) { node.expanded = false; node.children.forEach(collapseAll); }

searchInput.addEventListener("input", (e) => doSearch(e.target.value));
clearBtn.addEventListener("click", () => { searchInput.value = ""; doSearch(""); searchInput.focus(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== searchInput) { e.preventDefault(); searchInput.focus(); }
  if (e.key === "Escape") { if (detail.classList.contains("show")) detail.classList.remove("show"); else { searchInput.value=""; doSearch(""); } }
});

/* ============================================================================
   LENS TOGGLE + RESET + INIT
   ============================================================================ */
let usingLens = false;
function loadTree(src) {
  uid = 0;
  ROOT = makeTree(src, 0, 0);
  render();
  fitView();
}
document.getElementById("btnLens").addEventListener("click", (e) => {
  usingLens = !usingLens;
  e.target.textContent = usingLens ? "Domain view" : "Work lens";
  searchInput.value = "";
  loadTree(usingLens ? LENS : DATA);
});
document.getElementById("btnReset").addEventListener("click", () => {
  searchInput.value = "";
  loadTree(usingLens ? LENS : DATA);
});

loadTree(DATA);
// fade the hint after a few seconds
setTimeout(() => { const h = document.getElementById("hint"); if (h) h.style.opacity = 0; }, 6000);
window.addEventListener("resize", () => {}); // layout is viewport-independent; pan stays
</script>
